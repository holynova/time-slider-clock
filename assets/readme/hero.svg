    <text x="56" y="168" font-size="23" fill="#333333">TIME SLIDER — 时间从网格里滑出来</text>
    <text x="56" y="204" font-size="19" fill="#5a5a5a">分列 / 整位 / 原作双轨 / 字母栅格，四种模式。</text>
    <g id="chips" font-size="18" fill="#1a1a1a" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.5"/><text x="119" y="262">4 种模式</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.5"/><text x="257" y="262">4 个主题</text></g>
      <g><rect x="332" y="238" width="162" height="36" rx="18" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.5"/><text x="413" y="262">10–3600× 快进</text></g>
      <g><rect x="506" y="238" width="180" height="36" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="596" y="262" fill="#f5f5f5">已并入 100 Clocks</text></g>
    </g>
    <text x="56" y="318" font-size="18" fill="#5a5a5a">默认显示秒数 · 开场从零滑动到当前时间</text>
