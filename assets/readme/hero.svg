  <title id="title">滑轨时钟 Time Slider — 镂空像素滑轨时钟</title>
  <desc id="desc">浅灰墙面上的滑轨时钟：六条上下滑动的镂空网格列，中间黑色窗口显示橙色数字 06:42:20。</desc>

  <rect width="1200" height="360" rx="26" fill="#dcdcdc"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
