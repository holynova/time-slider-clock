}
let displayMode='clock',message='HELLO!',demoStart=0,demoPaused=false,demoElapsed=0;
function demoText(now=performance.now()){const elapsed=demoPaused?demoElapsed:now-demoStart;const page=Math.floor(elapsed/2500)%Math.ceil(demoCharacters.length/6);return demoCharacters.slice(page*6,page*6+6).padEnd(6,' ');}
let mode='live',last='',showSeconds=false,paused=false;
let speed=60,anchorMs=Date.now(),anchorTick=performance.now();
const $=id=>document.getElementById(id);
const secondScrews=[];
for(const t of tapes)if(t.d>=4)secondScrews.push(t.frame);
const secondColon=el('g',{fill:'url(#orange)'},$('colon'));
for(const y of[274,316])el('rect',{x:575,y,width:12,height:12},secondColon);
function formatTime(date,seconds=showSeconds){return [date.getHours(),date.getMinutes(),...(seconds?[date.getSeconds()]:[])].map(n=>String(n).padStart(2,'0')).join(':');}
function simulationMs(now=performance.now()){return anchorMs+(paused?0:Math.max(0,now-anchorTick)*speed);}
function reanchor(){anchorMs=simulationMs();anchorTick=performance.now();}
function currentDate(){return new Date(mode==='test'?simulationMs():Date.now());}

let introActive=false,introTimers=[];
function cancelIntro(){
 if(!introActive)return;
 introActive=false;introTimers.forEach(clearTimeout);introTimers=[];
 $('clock').dataset.phase='live';updateMotion();
}
function startIntro(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('clock').dataset.phase='live';tick(true);return;}
 introActive=true;
 $('clock').dataset.phase='zero';
 render(showSeconds?'00:00:00':'00:00',true);
 // Let the zero position paint before enabling the opening slide.
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(!introActive)return;
  introTimers.push(setTimeout(()=>{
   if(!introActive)return;
   $('clock').dataset.phase='sliding';
   $('clock').style.setProperty('--slide-duration','1.2s');
   tick(false,true);
   introTimers.push(setTimeout(()=>{
    introActive=false;introTimers=[];
    $('clock').dataset.phase='live';updateMotion();tick();
   },1260));
  },300));
 }));
}
function updateMotion(){const duration=mode==='test'&&!paused?Math.min(.75,(showSeconds?1:60)/speed*.65):.75;$('clock').style.setProperty('--slide-duration',`${duration}s`);}
function render(value,instant=false){
 if(value===last)return;last=value;const characters=displayMode==='clock'?value.replaceAll(':',''):value;
 for(const t of tapes){const glyph=glyphs[characters[t.d]||' '];
  for(const cell of t.cells){const open=glyph[cell.r*5+cell.c]==='1';const transform=`translateY(${cell.y-(open?14:0)}px)`;
   if(instant){cell.shutter.style.transition='none';cell.emitter.style.transition='none';}
   cell.shutter.style.transform=cell.emitter.style.transform=transform;
   if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{cell.shutter.style.transition='';cell.emitter.style.transition='';}));
  }
 }
 $('clockTitle').textContent=displayMode==='clock'?`${value}，${mode==='live'?'当前时间':'测试时间'}`:`栅格文字：${value.trim()}`;
 $('accessibleTime').textContent=value.trim();$('clock').dataset.time=value;$('clock').dataset.display=displayMode;
}
function tick(instant=false,allowIntro=false){if(introActive&&!allowIntro)return;const date=currentDate();$('date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);render(displayMode==='clock'?formatTime(date):displayMode==='demo'?demoText():message.padEnd(6,' '),instant);if(displayMode==='clock')$('accessibleTime').dateTime=date.toISOString();else $('accessibleTime').removeAttribute('datetime');}
function updateStatus(){if(displayMode!=='clock'){$('status').textContent=displayMode==='demo'?(demoPaused?'字符演示已暂停':'每 2.5 秒演示一组字符'):'正在显示文字';$('note').textContent='5×7 完整背板 · 每格独立滑片 · 6 个字符位';updateMotion();return;}$('status').textContent=mode==='live'?'正在走时':paused?'测试已暂停':`${speed} 倍快进`;$('note').textContent=mode==='live'?(showSeconds?'每一秒，换一种排列。':'每一分钟，换一种排列。'):`${paused?'已暂停':'时间以 '+speed+' 倍速度流逝'}，点击「实时」返回。`;updateMotion();}
function layout(){
 const clockMode=displayMode==='clock',six=!clockMode||showSeconds;
 for(const t of tapes){const shift=clockMode?0:-34*Math.floor(t.d/2);for(const g of [t.g,t.plate,t.light,t.frame])g.setAttribute('transform',`translate(${shift} 0)`);const hidden=t.d>=4&&!six;t.g.style.display=t.plate.style.display=t.light.style.display=t.frame.style.display=hidden?'none':'';}
 $('colon').style.display=clockMode?'':'none';secondColon.style.display=showSeconds?'':'none';
 $('clock').setAttribute('viewBox',`90 ${viewTop} ${clockMode?(six?765:527):697} ${viewHeight}`);$('clock').classList.toggle('seconds-visible',six);
 $('window').firstElementChild.setAttribute('width',six?688:450);
 const housing=$('housing');housing.children[0].setAttribute('width',clockMode?(six?713:475):645);housing.children[1].setAttribute('d',`M113 236h${clockMode?(six?710:472):642}`);housing.children[2].setAttribute('d',`M${clockMode?(six?825:587):757} 236v130`);
 $('seconds').disabled=!clockMode;
}
function updateSeconds(){cancelIntro();showSeconds=$('seconds').checked;layout();last='';updateStatus();tick(true);}
function setDisplay(next){
 cancelIntro();displayMode=next;last='';if(next==='demo'){demoStart=performance.now();demoElapsed=0;demoPaused=false;$('glyphPause').textContent='暂停演示';$('glyphPause').setAttribute('aria-pressed','false');}
 $('glyphPanel').hidden=next==='clock';$('glyphPause').hidden=next!=='demo';
 for(const id of ['clockDisplay','textDisplay']){const active=id===(next==='clock'?'clockDisplay':'textDisplay');$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active));}
 $('glyphDemo').setAttribute('aria-pressed',String(next==='demo'));layout();updateStatus();tick();
}
function startTest(){cancelIntro();const value=$('startTime').value;if(!/^\d{2}:\d{2}(:\d{2})?$/.test(value)){$('startTime').reportValidity();return;}const parts=value.split(':').map(Number);const date=new Date();date.setHours(parts[0],parts[1],parts[2]||0,0);anchorMs=date.getTime();anchorTick=performance.now();paused=false;$('pause').textContent='暂停';$('pause').setAttribute('aria-pressed','false');updateStatus();tick(true);}
function setMode(next){if(displayMode!=='clock')setDisplay('clock');cancelIntro();mode=next;document.body.classList.toggle('testing',next==='test');$('testPanel').hidden=next!=='test';for(const id of['live','test']){const active=id===next;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active));}last='';if(next==='test')startTest();else{paused=false;updateStatus();tick(true);}}
$('seconds').onchange=updateSeconds;$('live').onclick=()=>setMode('live');$('test').onclick=()=>{if(mode!=='test'){$('startTime').value=formatTime(new Date(),true);setMode('test');}};
$('speed').onchange=()=>{reanchor();speed=Number($('speed').value);updateStatus();tick();};
$('startTime').onchange=()=>{if(mode==='test')startTest();};$('restart').onclick=startTest;
$('pause').onclick=()=>{reanchor();paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('pause').setAttribute('aria-pressed',String(paused));updateStatus();tick();};

$('clockDisplay').onclick=()=>setDisplay('clock');$('textDisplay').onclick=()=>setDisplay('text');
function applyText(){const next=normalizeText($('message').value);if(next===null){$('glyphError').textContent='请输入 1–6 个支持的字符；中文或其他字符暂不支持。';$('message').setAttribute('aria-invalid','true');return;}$('glyphError').textContent='';$('message').removeAttribute('aria-invalid');message=next;$('message').value=next.trimEnd();setDisplay('text');}
$('applyText').onclick=applyText;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyText();}});
$('glyphDemo').onclick=()=>setDisplay('demo');$('glyphPause').onclick=()=>{if(demoPaused){demoStart=performance.now()-demoElapsed;}else{demoElapsed=performance.now()-demoStart;}demoPaused=!demoPaused;$('glyphPause').textContent=demoPaused?'继续演示':'暂停演示';$('glyphPause').setAttribute('aria-pressed',String(demoPaused));updateStatus();tick();};

$('theme').value=window.clockTheme.get();
$('theme').onchange=()=>window.clockTheme.set($('theme').value);
const settings=$('settings'),stage=document.querySelector('.stage');
function openSettings(){if(!settings.open){settings.showModal();$('menuButton').setAttribute('aria-expanded','true');}}
function closeSettings(){settings.close();}
settings.addEventListener('close',()=>{$('menuButton').setAttribute('aria-expanded','false');});
$('menuButton').onclick=openSettings;$('closeMenu').onclick=closeSettings;
settings.addEventListener('click',e=>{if(e.target===settings){const r=settings.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSettings();}});
$('pureMode').onchange=()=>{const pure=$('pureMode').checked;document.body.classList.toggle('pure-mode',pure);stage.tabIndex=pure?0:-1;if(pure){stage.setAttribute('role','button');stage.setAttribute('aria-label','时钟，轻点或按回车打开设置');closeSettings();stage.focus({preventScroll:true});}else{stage.removeAttribute('role');stage.setAttribute('aria-label','滑轨时钟');}};
stage.addEventListener('click',()=>{if(document.body.classList.contains('pure-mode'))openSettings();});
stage.addEventListener('keydown',e=>{if(document.body.classList.contains('pure-mode')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openSettings();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();closeSettings();}else{$('pureMode').checked=true;$('pureMode').dispatchEvent(new Event('change'));}}catch{$('note').textContent='当前浏览器暂不支持全屏显示。';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!settings.open&&document.body.classList.contains('pure-mode')){e.preventDefault();openSettings();}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏显示';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
$('startTime').value=formatTime(new Date(),true);$('startTime').required=true;updateSeconds();startIntro();setInterval(()=>tick(),100);
</script></body></html>
