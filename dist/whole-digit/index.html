<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c6c4c5">
<title>Time Slider · 整位滑轨时钟</title><meta name="description" content="时间在黑白滑轨之间流动。每个数字由一条完整滑轨呈现的实时机械时钟。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23262929'/%3E%3Cpath d='M8 7h16v18H8z' fill='%23e96723'/%3E%3Cpath d='M12 11h8v10h-8z' fill='%23262929'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{color:#373839;background:#c6c4c5;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.stage:focus-visible{outline:2px solid #b84916;outline-offset:4px}.page{height:100svh;background:radial-gradient(ellipse at 5% 22%,#eeecee 0,transparent 48%),linear-gradient(110deg,#cccacd,#c0bec0 72%,#bbb9bc)}.stage{height:100%;display:grid;place-items:center;padding:32px;position:relative}.clock,.clock.seconds-visible{display:block;width:min(1100px,100%);height:calc(100svh - 64px);overflow:visible}.rail{transition:transform var(--slide-duration,750ms) cubic-bezier(.23,.78,.23,1);will-change:transform}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button{border:1px solid #42404426;background:#ffffff24;cursor:pointer;border-radius:50px;min-height:44px;padding:0 17px;font-size:14px;transition:background .2s,border-color .2s}button:hover{background:#ffffff50;border-color:#42404466}button.active{background:#343536;color:#eceaec;border-color:#343536}.menu-trigger{position:fixed;z-index:2;right:24px;top:24px;width:44px;display:grid;place-items:center;padding:0;border-color:transparent;background:transparent}.menu-trigger svg{width:21px;height:21px}.pure-mode .menu-trigger{display:none}.pure-mode .stage{cursor:default}.settings{position:fixed;inset:76px 24px auto auto;margin:0;width:min(360px,calc(100vw - 32px));max-height:calc(100svh - 100px);overflow:auto;padding:20px;border:1px solid #ffffff88;border-radius:18px;background:#dedcde;box-shadow:0 14px 45px #28242c24;color:#373839}.settings::backdrop{background:#29242a12}.menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.menu-head h2{font-size:16px;font-weight:600;margin:0}.close-menu{width:36px;min-height:36px;padding:0;display:grid;place-items:center;border-color:transparent}.close-menu svg{width:16px;height:16px}.menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer;font-size:14px}.menu-row input{appearance:none;width:36px;height:22px;flex-shrink:0;border:1px solid #858185;border-radius:20px;position:relative;background:#aaa7aa;margin:0;cursor:pointer}.menu-row input:before{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#f3f1f3;transition:transform .2s}.menu-row input:checked{background:#d66127;border-color:#d66127}.menu-row input:checked:before{transform:translateX(14px)}.hint{font-size:12px;color:#706c71;line-height:1.6;margin:0 0 16px}.menu-section{padding-top:16px;margin-top:16px;border-top:1px solid #3d343d16}.controls{display:flex;gap:8px}.controls button{flex:1}.test-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;font-size:14px}.test-panel[hidden]{display:none}.test-panel label{display:grid;gap:7px;min-width:0}.test-panel input,.test-panel select{width:100%;min-width:0;font-size:14px;background:#ffffff38;border:1px solid #42404430;border-radius:8px;padding:8px;min-height:40px}.test-panel button{padding:0 10px}.versions{display:flex;gap:4px;border:1px solid #42404426;border-radius:30px;padding:3px;margin-top:14px}.versions a{flex:1;text-align:center;font-size:14px;line-height:36px;padding:0 8px;color:#5f5c60;text-decoration:none;border-radius:24px;white-space:nowrap}.versions a[aria-current="page"]{color:#eceaec;background:#343536}.versions a:hover{background:#ffffff38}.versions a[aria-current="page"]:hover{background:#343536}.full{width:100%}.date{font-size:13px;line-height:1.8}.caption,.status{font-size:12px;color:#706c71;line-height:1.6}.status{margin-top:8px}@media(max-width:600px){.stage{padding:20px 12px}.clock,.clock.seconds-visible{height:calc(100svh - 40px);width:100%}.menu-trigger{right:12px;top:12px}.settings{inset:64px 16px auto auto;max-height:calc(100svh - 80px);padding:18px}.page{background:radial-gradient(ellipse at 0% 25%,#eeecee,transparent 58%),#c3c1c4}}@media(prefers-reduced-motion:reduce){.rail,.menu-row input:before{transition:none}}
</style></head>
<body><main class="page">
<button class="menu-trigger" id="menuButton" aria-label="打开设置" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<section class="stage" aria-label="滑轨时钟"><svg class="clock" id="clock" viewBox="90 -238 527 1095" role="img" aria-labelledby="clockTitle"><title id="clockTitle">实时滑轨时钟</title><defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1eff0"/><stop offset=".5" stop-color="#c6c6c7"/><stop offset="1" stop-color="#aaa9ab"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f07830"/><stop offset=".55" stop-color="#dc5c1d"/><stop offset="1" stop-color="#c34c13"/></linearGradient>
<linearGradient id="housingFill"><stop stop-color="#38393a"/><stop offset=".6" stop-color="#292b2c"/><stop offset="1" stop-color="#3c3d3e"/></linearGradient>
<filter id="shadow" x="-70%" y="-15%" width="260%" height="140%"><feDropShadow dx="9" dy="7" stdDeviation="2.1" flood-color="#403b40" flood-opacity=".29"/></filter>
<filter id="frameShadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="7" dy="7" stdDeviation="2" flood-opacity=".20"/></filter>
<clipPath id="window"><rect x="125" y="252" width="450" height="115"/></clipPath>
</defs><g id="housing" filter="url(#frameShadow)"><rect x="112" y="235" width="475" height="146" rx="1" fill="url(#housingFill)"/><path d="M113 236h472" stroke="#666769" stroke-opacity=".5"/><path d="M587 236v145" stroke="#151718" stroke-width="3"/></g><g id="backplates" clip-path="url(#window)"></g><g id="tapes"></g><g id="colon" fill="url(#orange)"><rect x="337" y="275" width="21" height="21"/><rect x="337" y="321" width="21" height="21"/></g><g id="screws"></g></svg>
<time id="accessibleTime" class="sr-only"></time></section>

</main><dialog id="settings" class="settings" aria-labelledby="settingsTitle"><div class="menu-head"><h2 id="settingsTitle">时钟设置</h2><button id="closeMenu" class="close-menu" aria-label="关闭设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label class="menu-row">显示秒数<input id="seconds" type="checkbox" role="switch" checked></label><label class="menu-row">仅时钟<input id="pureMode" type="checkbox" role="switch" aria-describedby="pureHint"></label><p class="hint" id="pureHint">仅时钟模式下，轻点时钟或按 Esc 可打开设置。</p><div class="menu-section"><div class="controls"><button id="live" class="active" aria-pressed="true">实时</button><button id="test" aria-pressed="false" aria-controls="testPanel">快进测试</button></div><div class="test-panel" id="testPanel" hidden><label>起始时间<input id="startTime" type="time" step="1" aria-label="测试起始时间"></label><label>速度<select id="speed" aria-label="测试速度"><option value="10">10 倍</option><option value="60" selected>60 倍</option><option value="600">600 倍</option><option value="3600">3600 倍</option></select></label><button id="pause" aria-pressed="false">暂停</button><button id="restart">重新开始</button></div></div><div class="menu-section"><button id="fullscreen" class="full">全屏显示</button><nav class="versions" aria-label="滑轨版本"><a href="/">分列滑轨</a><a href="/whole-digit/" aria-current="page">整位滑轨</a></nav></div><div class="menu-section"><div id="date" class="date"></div><div id="note" class="caption"></div><div id="status" class="status"></div></div></dialog><script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const digits=['111101101101111','001001001001001','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
const digitRows=n=>digits[n].match(/.{3}/g).map(row=>parseInt(row,2)).join('');
// Each fixed tape holds complete three-cell rows; all three columns share one transform.
function shortestTape(patterns){const p=[...new Set(patterns)],n=p.length,dp=Array.from({length:1<<n},()=>Array(n).fill(null));for(let i=0;i<n;i++)dp[1<<i][i]=p[i];for(let mask=1;mask<(1<<n);mask++)for(let i=0;i<n;i++){const a=dp[mask][i];if(!a)continue;for(let j=0;j<n;j++){if(mask>>j&1)continue;let k=5;while(k&&!a.endsWith(p[j].slice(0,k)))k--;const next=a+p[j].slice(k),m=mask|1<<j;if(dp[m][j]===null||next.length<dp[m][j].length)dp[m][j]=next;}}return dp[(1<<n)-1].reduce((a,b)=>a===null||b.length<a.length?b:a,null);}
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;}
const tapes=[],cell=23,starts=[135,237,373,475,611,713];
// All positions use the very same physical mask, including the restricted tens positions.
const sharedRows='0'+shortestTape(digits.map((_,n)=>digitRows(n)))+'0';
const railOffsets=digits.map((_,n)=>sharedRows.indexOf(digitRows(n)));
const railTop=252-Math.max(...railOffsets)*cell-2;
const railBottom=252-Math.min(...railOffsets)*cell+sharedRows.length*cell+2;
const viewTop=railTop-28,viewHeight=railBottom-railTop+56;
for(let d=0;d<6;d++){
 const rows=sharedRows,x=starts[d];
 const plate=el('g',{'data-digit':d},document.getElementById('backplates'));
 // Fixed orange 8-shaped backing. Openings in the moving mask reveal it.
 for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(digits[8][r*3+c]==='1'){
  el('rect',{x:x+c*23,y:252+r*cell+1,width:21,height:21,fill:'url(#orange)',stroke:'#a63e13','stroke-width':.3},plate);
 }
 const g=el('g',{class:'rail','data-digit':d,'data-rows':rows},document.getElementById('tapes'));
 // A single perforated black sheet: openings are transparent, not white tiles.
 let outline=`M${x-2} -2h71v${rows.length*cell+4}h-71z`;
 const edges=[];
 for(let row=0;row<rows.length;row++)for(let c=0;c<3;c++){
  const lit=(Number(rows[row])>>(2-c))&1,px=x+c*23,y=row*cell+1;
  if(lit){outline+=`M${px} ${y}h21v21h-21z`;edges.push(`M${px} ${y+21}h21v-21`);}
 }
 el('path',{d:outline,fill:'#252627','fill-rule':'evenodd',stroke:'#121415','stroke-width':.35,filter:'url(#shadow)','data-grid':'perforated'},g);
 el('path',{d:edges.join(''),fill:'none',stroke:'#77787a','stroke-width':.5,'stroke-opacity':.55},g);
 tapes.push({d,rows,g,plate});
}
for(const x of starts){for(const sx of[x+5,x+60]){el('circle',{cx:sx,cy:375,r:2.2,fill:'#181a1b'},document.getElementById('screws'));el('path',{d:`M${sx-1} 374.5h2`,stroke:'#929294','stroke-width':.8},document.getElementById('screws'));}}
let mode='live',last='',showSeconds=false,paused=false;
let speed=60,anchorMs=Date.now(),anchorTick=performance.now();
const $=id=>document.getElementById(id);
const secondScrews=[];
for(const node of Array.from($('screws').children).slice(16))secondScrews.push(node);
const secondColon=el('g',{fill:'url(#orange)'},$('colon'));
for(const y of[275,321])el('rect',{x:575,y,width:21,height:21},secondColon);
function formatTime(date,seconds=showSeconds){return [date.getHours(),date.getMinutes(),...(seconds?[date.getSeconds()]:[])].map(n=>String(n).padStart(2,'0')).join(':');}
function simulationMs(now=performance.now()){return anchorMs+(paused?0:Math.max(0,now-anchorTick)*speed);}
function reanchor(){anchorMs=simulationMs();anchorTick=performance.now();}
function currentDate(){return new Date(mode==='test'?simulationMs():Date.now());}
function updateMotion(){const duration=mode==='test'&&!paused?Math.min(.75,(showSeconds?1:60)/speed*.65):.75;$('clock').style.setProperty('--slide-duration',`${duration}s`);}
function render(value,instant=false){if(value===last)return;last=value;const numbers=value.replaceAll(':','').split('').map(Number);for(const t of tapes){if(t.d>=numbers.length)continue;const offset=t.rows.indexOf(digitRows(numbers[t.d]));if(offset<0)throw new Error('Tape pattern missing');if(instant){t.g.style.transition='none';}const transform=`translateY(${252-offset*cell}px)`;t.g.style.transform=transform;if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{t.g.style.transition='';}));}$('clockTitle').textContent=`${value}，${mode==='live'?'当前时间':'测试时间'}`;$('accessibleTime').textContent=value;$('clock').dataset.time=value;}
function tick(instant=false){const date=currentDate();$('date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);render(formatTime(date),instant);$('accessibleTime').dateTime=date.toISOString();}
function updateStatus(){$('status').textContent=mode==='live'?'正在走时':paused?'测试已暂停':`${speed} 倍快进`;$('note').textContent=mode==='live'?(showSeconds?'每一秒，换一种排列。':'每一分钟，换一种排列。'):`${paused?'已暂停':'时间以 '+speed+' 倍速度流逝'}，点击「实时」返回。`;updateMotion();}
function updateSeconds(){showSeconds=$('seconds').checked;for(const t of tapes){t.g.style.display=t.plate.style.display=t.d>=4&&!showSeconds?'none':'';}for(const n of secondScrews)n.style.display=showSeconds?'':'none';secondColon.style.display=showSeconds?'':'none';$('clock').setAttribute('viewBox',`90 ${viewTop} ${showSeconds?765:527} ${viewHeight}`);$('clock').classList.toggle('seconds-visible',showSeconds);$('window').firstElementChild.setAttribute('width',showSeconds?688:450);const housing=$('housing');housing.children[0].setAttribute('width',showSeconds?713:475);housing.children[1].setAttribute('d',`M113 236h${showSeconds?710:472}`);housing.children[2].setAttribute('d',`M${showSeconds?825:587} 236v145`);last='';updateStatus();tick(true);}
function startTest(){const value=$('startTime').value;if(!/^\d{2}:\d{2}(:\d{2})?$/.test(value)){$('startTime').reportValidity();return;}const parts=value.split(':').map(Number);const date=new Date();date.setHours(parts[0],parts[1],parts[2]||0,0);anchorMs=date.getTime();anchorTick=performance.now();paused=false;$('pause').textContent='暂停';$('pause').setAttribute('aria-pressed','false');updateStatus();tick(true);}
function setMode(next){mode=next;document.body.classList.toggle('testing',next==='test');$('testPanel').hidden=next!=='test';for(const id of['live','test']){const active=id===next;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active));}last='';if(next==='test')startTest();else{paused=false;updateStatus();tick(true);}}
$('seconds').onchange=updateSeconds;$('live').onclick=()=>setMode('live');$('test').onclick=()=>{if(mode!=='test'){$('startTime').value=formatTime(new Date(),true);setMode('test');}};
$('speed').onchange=()=>{reanchor();speed=Number($('speed').value);updateStatus();tick();};
$('startTime').onchange=()=>{if(mode==='test')startTest();};$('restart').onclick=startTest;
$('pause').onclick=()=>{reanchor();paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('pause').setAttribute('aria-pressed',String(paused));updateStatus();tick();};

const settings=$('settings'),stage=document.querySelector('.stage');
function openSettings(){if(!settings.open){settings.showModal();$('menuButton').setAttribute('aria-expanded','true');}}
function closeSettings(){settings.close();}
settings.addEventListener('close',()=>{$('menuButton').setAttribute('aria-expanded','false');});
$('menuButton').onclick=openSettings;$('closeMenu').onclick=closeSettings;
settings.addEventListener('click',e=>{if(e.target===settings){const r=settings.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSettings();}});
$('pureMode').onchange=()=>{const pure=$('pureMode').checked;document.body.classList.toggle('pure-mode',pure);stage.tabIndex=pure?0:-1;if(pure){stage.setAttribute('role','button');stage.setAttribute('aria-label','时钟，轻点或按回车打开设置');closeSettings();stage.focus({preventScroll:true});}else{stage.removeAttribute('role');stage.setAttribute('aria-label','滑轨时钟');}};
stage.addEventListener('click',()=>{if(document.body.classList.contains('pure-mode'))openSettings();});
stage.addEventListener('keydown',e=>{if(document.body.classList.contains('pure-mode')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openSettings();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();closeSettings();}else{$('pureMode').checked=true;$('pureMode').dispatchEvent(new Event('change'));}}catch{$('note').textContent='当前浏览器暂不支持全屏显示。';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!settings.open&&document.body.classList.contains('pure-mode')){e.preventDefault();openSettings();}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏显示';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
$('startTime').value=formatTime(new Date(),true);$('startTime').required=true;updateSeconds();setInterval(()=>tick(),100);
</script></body></html>
