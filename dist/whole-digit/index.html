<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{color:#373839;background:#c6c4c5;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #b84916;outline-offset:5px}.page{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 5% 22%,#eeecee 0,transparent 48%),linear-gradient(110deg,#cccacd,#c0bec0 72%,#bbb9bc);overflow:hidden}header,footer{display:flex;align-items:center;justify-content:space-between;padding:30px 40px;gap:24px}header{position:relative;z-index:1}.brand{font-size:14px;font-weight:600;letter-spacing:.19em;display:flex;align-items:center;gap:12px}.mark{width:8px;height:8px;background:#dc6229}.zone{font-size:12px;letter-spacing:.08em;color:#626163}.stage{flex:1;min-height:420px;display:grid;place-items:center;position:relative;padding:12px 30px}.clock{width:min(860px,100%);height:min(760px,calc(100svh - 210px));overflow:visible;display:block}.rail{transition:transform 1050ms cubic-bezier(.23,.78,.23,1);will-change:transform}.stage:before{content:"";position:absolute;width:70%;height:45%;top:25%;background:radial-gradient(ellipse,#a5a1a533,transparent 65%);pointer-events:none}footer{align-items:flex-end}.date{font-size:14px;letter-spacing:.045em;line-height:1.8}.caption{font-size:12px;color:#6a686a;margin-top:3px;letter-spacing:.025em}.controls{display:flex;align-items:center;gap:8px}button{border:1px solid #42404426;background:#ffffff12;cursor:pointer;border-radius:50px;min-height:42px;padding:0 17px;font-size:13px;transition:background .2s,border-color .2s}button:hover{background:#ffffff38;border-color:#42404466}button.active{background:#343536;color:#eceaec;border-color:#343536}.full{width:42px;padding:10px;display:grid;place-items:center}.full svg{width:18px;height:18px}.status{display:flex;gap:8px;align-items:center;font-size:12px;color:#686568;margin-right:9px}.status i{width:5px;height:5px;background:#d65a25;border-radius:50%;display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body.full-view header,body.full-view footer>div:first-child,body.full-view .status,body.full-view #live,body.full-view #test{visibility:hidden}body.full-view .full{position:fixed;bottom:24px;right:24px}@media(max-width:600px){header,footer{padding:25px 23px}header{gap:12px}.brand{font-size:12px}.zone{font-size:11px}.stage{padding:0 13px;min-height:380px}footer{align-items:center;flex-direction:column;gap:23px;padding-bottom:30px}.date{text-align:center;font-size:13px}.caption{font-size:12px}.status{display:none}.clock{width:100%;height:min(520px,calc(100svh - 240px))}.page{background:radial-gradient(ellipse at 0% 25%,#eeecee,transparent 58%),#c3c1c4}}@media(prefers-reduced-motion:reduce){.rail{transition:none}}@media(max-height:600px) and (min-width:601px){header,footer{padding:18px 30px}.stage{min-height:250px}.clock{width:min(640px,78vh)}}

.controls{flex-wrap:wrap;justify-content:flex-end}.control-area{display:flex;flex-direction:column;align-items:flex-end;gap:14px}.seconds-toggle{display:flex;align-items:center;gap:9px;font-size:13px;min-height:42px;padding:0 10px;cursor:pointer}.seconds-toggle input{appearance:none;width:30px;height:18px;border:1px solid #777477;border-radius:20px;position:relative;background:#aaa7aa;margin:0;cursor:pointer}.seconds-toggle input:before{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#ebe9eb;transition:transform .2s}.seconds-toggle input:checked{background:#d66127;border-color:#d66127}.seconds-toggle input:checked:before{transform:translateX(12px)}input:focus-visible,select:focus-visible{outline:2px solid #b84916;outline-offset:4px}.test-panel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;font-size:13px}.test-panel[hidden]{display:none}.test-panel label{display:flex;gap:8px;align-items:center}.test-panel input,.test-panel select{font:inherit;background:#ffffff30;border:1px solid #42404430;border-radius:8px;padding:8px;color:#373839;min-height:36px}.test-panel input{width:130px}.test-panel button{min-height:36px}.clock{transition:width .3s}.clock.seconds-visible{width:min(1100px,100%)}.rail{transition-duration:var(--slide-duration,750ms)}body.testing .clock{height:min(760px,calc(100svh - 265px))}body.full-view .seconds-toggle,body.full-view .test-panel{visibility:hidden}@media(max-width:600px){.control-area{align-items:center;width:100%}.controls{justify-content:center;gap:5px}.controls button{padding:0 13px}.controls .full{padding:10px}.seconds-toggle{padding:0 4px;font-size:12px;gap:6px}.test-panel{justify-content:center;gap:10px}.test-panel label{font-size:12px}.test-panel input{width:118px}.stage{min-height:300px}.clock{height:min(520px,calc(100svh - 260px))}body.testing .clock{height:min(480px,calc(100svh - 335px))}footer{gap:16px}body.testing .caption{max-width:330px}}
.versions{display:flex;gap:4px;border:1px solid #42404426;border-radius:30px;padding:3px}.versions a{font-size:12px;line-height:28px;padding:0 12px;color:#5f5c60;text-decoration:none;border-radius:24px;white-space:nowrap}.versions a[aria-current="page"]{color:#eceaec;background:#343536}.versions a:hover{background:#ffffff38}.versions a[aria-current="page"]:hover{background:#343536}.versions a:focus-visible{outline:2px solid #b84916;outline-offset:4px}@media(max-width:600px){header{flex-wrap:wrap}.versions{order:3;margin:0 auto}.zone{margin-left:auto}.clock{height:min(520px,calc(100svh - 300px))}body.testing .clock{height:min(480px,calc(100svh - 375px))}}

<body><main class="page">
<header><div class="brand"><span class="mark"></span>TIME SLIDER</div><nav class="versions" aria-label="滑轨版本"><a href="/">分列滑轨</a><a href="/whole-digit/" aria-current="page">整位滑轨</a></nav><span class="zone" id="zone">本地时间 · 24 小时</span></header>
<section class="stage" aria-label="滑轨时钟"><svg class="clock" id="clock" viewBox="90 -238 527 1095" role="img" aria-labelledby="clockTitle"><title id="clockTitle">实时滑轨时钟</title><defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1eff0"/><stop offset=".5" stop-color="#c6c6c7"/><stop offset="1" stop-color="#aaa9ab"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f07830"/><stop offset=".55" stop-color="#dc5c1d"/><stop offset="1" stop-color="#c34c13"/></linearGradient>
<linearGradient id="housingFill"><stop stop-color="#38393a"/><stop offset=".6" stop-color="#292b2c"/><stop offset="1" stop-color="#3c3d3e"/></linearGradient>
<filter id="shadow" x="-70%" y="-15%" width="260%" height="140%"><feDropShadow dx="9" dy="7" stdDeviation="2.1" flood-color="#403b40" flood-opacity=".29"/></filter>
<filter id="frameShadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="7" dy="7" stdDeviation="2" flood-opacity=".20"/></filter>
<clipPath id="window"><rect x="125" y="252" width="450" height="115"/></clipPath>
</defs><g id="housing" filter="url(#frameShadow)"><rect x="112" y="235" width="475" height="146" rx="1" fill="url(#housingFill)"/><path d="M113 236h472" stroke="#666769" stroke-opacity=".5"/><path d="M587 236v145" stroke="#151718" stroke-width="3"/></g><g id="backplates" clip-path="url(#window)"></g><g id="tapes"></g><g id="colon" fill="url(#orange)"><rect x="337" y="275" width="21" height="21"/><rect x="337" y="321" width="21" height="21"/></g><g id="screws"></g></svg>
<time id="accessibleTime" class="sr-only"></time></section>
<footer><div><div class="date" id="date"></div><div class="caption" id="note">每一分钟，换一种排列。</div></div><div class="control-area"><div class="controls"><span class="status"><i></i><span id="status">正在走时</span></span><label class="seconds-toggle"><input id="seconds" type="checkbox" role="switch">显示秒数</label><button id="live" class="active" aria-pressed="true">实时</button><button id="test" aria-pressed="false" aria-controls="testPanel">快进测试</button><button id="fullscreen" class="full" aria-label="全屏显示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div><div class="test-panel" id="testPanel" hidden><label>起始时间<input id="startTime" type="time" step="1" aria-label="测试起始时间"></label><label>速度<select id="speed" aria-label="测试速度"><option value="10">10 倍</option><option value="60" selected>60 倍</option><option value="600">600 倍</option><option value="3600">3600 倍</option></select></label><button id="pause" aria-pressed="false">暂停</button><button id="restart">重新开始</button></div></div></footer>
</main><script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const digits=['111101101101111','001001001001001','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
const digitRows=n=>digits[n].match(/.{3}/g).map(row=>parseInt(row,2)).join('');
// Each fixed tape holds complete three-cell rows; all three columns share one transform.
function shortestTape(patterns){const p=[...new Set(patterns)],n=p.length,dp=Array.from({length:1<<n},()=>Array(n).fill(null));for(let i=0;i<n;i++)dp[1<<i][i]=p[i];for(let mask=1;mask<(1<<n);mask++)for(let i=0;i<n;i++){const a=dp[mask][i];if(!a)continue;for(let j=0;j<n;j++){if(mask>>j&1)continue;let k=5;while(k&&!a.endsWith(p[j].slice(0,k)))k--;const next=a+p[j].slice(k),m=mask|1<<j;if(dp[m][j]===null||next.length<dp[m][j].length)dp[m][j]=next;}}return dp[(1<<n)-1].reduce((a,b)=>a===null||b.length<a.length?b:a,null);}
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;}
const tapes=[],cell=23,starts=[135,237,373,475,611,713];
// All positions use the very same physical mask, including the restricted tens positions.
const sharedRows='0'+shortestTape(digits.map((_,n)=>digitRows(n)))+'0';
const railOffsets=digits.map((_,n)=>sharedRows.indexOf(digitRows(n)));
const railTop=252-Math.max(...railOffsets)*cell-2;
const railBottom=252-Math.min(...railOffsets)*cell+sharedRows.length*cell+2;
const viewTop=railTop-28,viewHeight=railBottom-railTop+56;
for(let d=0;d<6;d++){
 const rows=sharedRows,x=starts[d];
 const plate=el('g',{'data-digit':d},document.getElementById('backplates'));
 // Fixed orange 8-shaped backing. Openings in the moving mask reveal it.
 for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(digits[8][r*3+c]==='1'){
  el('rect',{x:x+c*23,y:252+r*cell+1,width:21,height:21,fill:'url(#orange)',stroke:'#a63e13','stroke-width':.3},plate);
 }
 const g=el('g',{class:'rail','data-digit':d,'data-rows':rows},document.getElementById('tapes'));
 // A single perforated black sheet: openings are transparent, not white tiles.
 let outline=`M${x-2} -2h71v${rows.length*cell+4}h-71z`;
 const edges=[];
 for(let row=0;row<rows.length;row++)for(let c=0;c<3;c++){
  const lit=(Number(rows[row])>>(2-c))&1,px=x+c*23,y=row*cell+1;
  if(lit){outline+=`M${px} ${y}h21v21h-21z`;edges.push(`M${px} ${y+21}h21v-21`);}
 }
 el('path',{d:outline,fill:'#252627','fill-rule':'evenodd',stroke:'#121415','stroke-width':.35,filter:'url(#shadow)','data-grid':'perforated'},g);
 el('path',{d:edges.join(''),fill:'none',stroke:'#77787a','stroke-width':.5,'stroke-opacity':.55},g);
 tapes.push({d,rows,g,plate});
}
for(const x of starts){for(const sx of[x+5,x+60]){el('circle',{cx:sx,cy:375,r:2.2,fill:'#181a1b'},document.getElementById('screws'));el('path',{d:`M${sx-1} 374.5h2`,stroke:'#929294','stroke-width':.8},document.getElementById('screws'));}}
let mode='live',last='',showSeconds=false,paused=false;
let speed=60,anchorMs=Date.now(),anchorTick=performance.now();
const $=id=>document.getElementById(id);
const secondScrews=[];
for(const node of Array.from($('screws').children).slice(16))secondScrews.push(node);
const secondColon=el('g',{fill:'url(#orange)'},$('colon'));
for(const y of[275,321])el('rect',{x:575,y,width:21,height:21},secondColon);
function formatTime(date,seconds=showSeconds){return [date.getHours(),date.getMinutes(),...(seconds?[date.getSeconds()]:[])].map(n=>String(n).padStart(2,'0')).join(':');}
function simulationMs(now=performance.now()){return anchorMs+(paused?0:Math.max(0,now-anchorTick)*speed);}
function reanchor(){anchorMs=simulationMs();anchorTick=performance.now();}
function currentDate(){return new Date(mode==='test'?simulationMs():Date.now());}
function updateMotion(){const duration=mode==='test'&&!paused?Math.min(.75,(showSeconds?1:60)/speed*.65):.75;$('clock').style.setProperty('--slide-duration',`${duration}s`);}
function render(value,instant=false){if(value===last)return;last=value;const numbers=value.replaceAll(':','').split('').map(Number);for(const t of tapes){if(t.d>=numbers.length)continue;const offset=t.rows.indexOf(digitRows(numbers[t.d]));if(offset<0)throw new Error('Tape pattern missing');if(instant){t.g.style.transition='none';}const transform=`translateY(${252-offset*cell}px)`;t.g.style.transform=transform;if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{t.g.style.transition='';}));}$('clockTitle').textContent=`${value}，${mode==='live'?'当前时间':'测试时间'}`;$('accessibleTime').textContent=value;$('clock').dataset.time=value;}
function tick(instant=false){const date=currentDate();$('date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);render(formatTime(date),instant);$('accessibleTime').dateTime=date.toISOString();}
function updateStatus(){$('status').textContent=mode==='live'?'正在走时':paused?'测试已暂停':`${speed} 倍快进`;$('note').textContent=mode==='live'?(showSeconds?'每一秒，换一种排列。':'每一分钟，换一种排列。'):`${paused?'已暂停':'时间以 '+speed+' 倍速度流逝'}，点击「实时」返回。`;updateMotion();}
function updateSeconds(){showSeconds=$('seconds').checked;for(const t of tapes){t.g.style.display=t.plate.style.display=t.d>=4&&!showSeconds?'none':'';}for(const n of secondScrews)n.style.display=showSeconds?'':'none';secondColon.style.display=showSeconds?'':'none';$('clock').setAttribute('viewBox',`90 ${viewTop} ${showSeconds?765:527} ${viewHeight}`);$('clock').classList.toggle('seconds-visible',showSeconds);$('window').firstElementChild.setAttribute('width',showSeconds?688:450);const housing=$('housing');housing.children[0].setAttribute('width',showSeconds?713:475);housing.children[1].setAttribute('d',`M113 236h${showSeconds?710:472}`);housing.children[2].setAttribute('d',`M${showSeconds?825:587} 236v145`);last='';updateStatus();tick(true);}
function startTest(){const value=$('startTime').value;if(!/^\d{2}:\d{2}(:\d{2})?$/.test(value)){$('startTime').reportValidity();return;}const parts=value.split(':').map(Number);const date=new Date();date.setHours(parts[0],parts[1],parts[2]||0,0);anchorMs=date.getTime();anchorTick=performance.now();paused=false;$('pause').textContent='暂停';$('pause').setAttribute('aria-pressed','false');updateStatus();tick(true);}
function setMode(next){mode=next;document.body.classList.toggle('testing',next==='test');$('testPanel').hidden=next!=='test';for(const id of['live','test']){const active=id===next;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active));}last='';if(next==='test')startTest();else{paused=false;updateStatus();tick(true);}}
$('seconds').onchange=updateSeconds;$('live').onclick=()=>setMode('live');$('test').onclick=()=>{if(mode!=='test'){$('startTime').value=formatTime(new Date(),true);setMode('test');}};
$('speed').onchange=()=>{reanchor();speed=Number($('speed').value);updateStatus();tick();};
$('startTime').onchange=()=>{if(mode==='test')startTest();};$('restart').onclick=startTest;
$('pause').onclick=()=>{reanchor();paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('pause').setAttribute('aria-pressed',String(paused));updateStatus();tick();};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{document.body.classList.toggle('full-view');$('fullscreen').setAttribute('aria-label',document.body.classList.contains('full-view')?'退出全屏':'全屏显示');}}catch{$('note').textContent='当前浏览器暂不支持全屏显示。';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('full-view');$('fullscreen').setAttribute('aria-label','全屏显示');}});document.addEventListener('fullscreenchange',()=>$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'退出全屏':'全屏显示'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
$('startTime').value=formatTime(new Date(),true);$('startTime').required=true;updateSeconds();setInterval(()=>tick(),100);
</script></body></html>
